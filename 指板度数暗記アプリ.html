<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>指板の度数</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1d2733;background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px 14px 40px}.app{max-width:900px;margin:auto}h1{font-size:20px;margin:0 0 18px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:25px}.tabs button{font:inherit;font-size:clamp(11px,2.5vw,15px);border:1px solid #ccd3dc;border-radius:9px;background:#f6f7f9;padding:12px 0;color:#344054}.tabs button.active{background:#174d88;color:white;border-color:#174d88}.board{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,52px);touch-action:manipulation}.string-label{display:flex;align-items:center;justify-content:center;font-size:12px;color:#697586}.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:2px solid #737d89;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;background:linear-gradient(to bottom,transparent calc(50% - 1px),#727a84 calc(50% - 1px),#727a84 calc(50% + 1px),transparent calc(50% + 1px))}.cell.first{border-left:2px solid #737d89}.cell.top{border-top:1px solid #a5adb8}.cell.bottom{border-bottom:1px solid #a5adb8}.cell span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:18px;background:#e8f1fa;color:#164e86;font-size:14px;font-weight:700}.cell.root span{background:#16569a;color:#fff}.actions{display:flex;justify-content:center;margin-top:24px}.actions button{font:inherit;padding:12px 24px;border-radius:10px;border:1px solid #c8d1db;background:white;color:#344054}.hint{text-align:center;color:#6b7280;font-size:13px;margin-top:18px}@media(max-width:440px){body{padding:20px 8px}.board{grid-template-columns:23px repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,47px)}.cell span{min-width:30px;height:30px;font-size:12px}.tabs{gap:3px}.tabs button{padding:10px 0;font-size:10px}}</style></head><body><main class="app"><h1>指板の度数</h1><nav class="tabs" id="tabs" aria-label="ルート弦を選択"></nav><section class="board" id="board" aria-label="指板"></section><div class="actions"><button id="clear">すべて隠す</button></div><p class="hint">空白の位置をタップすると度数を表示・非表示にできます</p></main><script>const tuning=[4,11,7,2,9,4];const names=['R','♭9','9','m3','M3','11','♭5','P5','♭13','13','m7','M7'];let rootString=6;let shown=new Set();const tabs=document.getElementById('tabs'),board=document.getElementById('board');function render(){tabs.replaceChildren();for(let n=6;n>=1;n--){let b=document.createElement('button');b.textContent=n+'弦';b.className=n===rootString?'active':'';b.setAttribute('aria-pressed',String(n===rootString));b.onclick=()=>{rootString=n;shown.clear();render()};tabs.append(b)}board.replaceChildren();const rootPitch=(tuning[rootString-1]+3)%12;for(let row=0;row<6;row++){let label=document.createElement('div');label.className='string-label';label.textContent=(row+1)+'弦';board.append(label);for(let fret=0;fret<7;fret++){let key=row+'-'+fret;let isRoot=row===rootString-1&&fret===3;let pitch=(tuning[row]+fret)%12;let degree=names[(pitch-rootPitch+12)%12];let cell=document.createElement('div');cell.className='cell'+(fret===0?' first':'')+(isRoot?' root':'')+(row===0?' top':'')+(row===5?' bottom':'');cell.setAttribute('role','button');cell.tabIndex=0;cell.setAttribute('aria-label',(row+1)+'弦 左から'+(fret+1)+'列目 '+(isRoot?'ルート':shown.has(key)?degree:'答えを表示'));function toggle(){if(isRoot)return;if(shown.has(key))shown.delete(key);else shown.add(key);render()}cell.onclick=toggle;cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};if(isRoot||shown.has(key)){let span=document.createElement('span');span.textContent=isRoot?'R':degree;cell.append(span)}board.append(cell)}}}document.getElementById('clear').onclick=()=>{shown.clear();render()};render();</script></body></html>
